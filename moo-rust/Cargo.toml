[package]
name = "moo-rust"
version = "0.1.0"
edition = "2021"
description = "Moo tokenizer port to Rust with spectral optimization"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "bench"
harness = false
